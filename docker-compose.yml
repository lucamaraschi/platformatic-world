services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wf
      POSTGRES_PASSWORD: wf
      POSTGRES_DB: workflow
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      # Postgres 18+ expects the volume at /var/lib/postgresql (not .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wf -d workflow']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
